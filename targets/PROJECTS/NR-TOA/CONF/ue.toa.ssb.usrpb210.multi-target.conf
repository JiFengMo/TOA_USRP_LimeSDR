# NR-TOA UE / positioning receiver - USRP B210 targeted multi-cell scan example
# scan_targets syntax: center_freq_hz@pci, center_freq_hz@pci, ...
# If @pci is omitted, that target will use blind PCI detection on the configured frequency.
sdr = usrp
sdr_addrs = serial=2512531
clock_source = internal
time_source = internal
center_freq_hz = 2114550000
sample_rate_hz = 30720000
rx_gain_db = 64
tx_gain_db = 0
mode = SSB_TOA
full_band_sweep = 0
strict_center_freq = 0
gain_sweep_enable = 0
target_pci = -1
scan_targets = 2114550000@84, 3550080000@188, 3558720000
iq_dump_enable = 1
ssb_scs_khz = 15
ssb_period_ms = 20
anchor_db_path = targets/PROJECTS/NR-TOA/CONF/anchors.csv
